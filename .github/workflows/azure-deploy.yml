name: Azure Deployment

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  buildVersion: '${{ vars.MAJOR_VERSION }}.${{ vars.MINOR_VERSION }}.${{ github.run_number }}'

jobs:
  test:
    runs-on: ubuntu-latest
    environment: 'test'
    concurrency:
      group: test-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Install azd
        uses: Azure/setup-azd@v2
        
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: azd login
        run: azd auth login --federated-credential-provider github --client-id ${{ secrets.AZURE_CLIENT_ID }} --tenant-id ${{ secrets.AZURE_TENANT_ID }}

      - name: Publish
        env:
          AZURE_LOCATION: 'westus2'
          AZURE_RESOURCE_GROUP: 'rg-niobium-identity-test'
          AZURE_ENV_NAME: 'test'
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          CUSTOM_DOMAIN_NAME: ${{ secrets.CUSTOM_DOMAIN_NAME }}
          IS_INTERACTIVE_DEPLOYER: false
          APPSETTING_SERVICE_NAME: 'Niobium.Identity.Server.Test'
          APPSETTING_SERVICE_VERSION: '${{ env.buildVersion }}-prerelease'
          APPSETTING_CAPTCHAOPTIONS__ISDISABLED: 'true'
          APPSETTING_IDENTITYSERVICEOPTIONS__IDTOKENPUBLICKEY: '-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----'
          APPSETTING_IDENTITYSERVICEOPTIONS__IDTOKENPRIVATEKEY: '-----BEGIN RSA PRIVATE KEY----------END RSA PRIVATE KEY-----'
          APPSETTING_IDENTITYSERVICEOPTIONS__IDTOKENPRIVATEKEYPASSCODE: 'Mlgbhahahaha123$56'
          APPSETTING_IDENTITYSERVICEOPTIONS__TOKENVALIDITY: '720'
          APPSETTING_IDENTITYAPIOPTIONS__TENANTID: '0bc0ab9b-a65a-4435-830b-9f66e52b5769'
          APPSETTING_IDENTITYAPIOPTIONS__APPLICATIONID: 'e514f381-77cd-4ce9-ab6c-1a960fc7d9ed'
        run: |
          azd package --no-prompt
          azd provision --no-state --no-prompt
          azd deploy --no-prompt
      
  prod:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: 'prod'
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: azd login
        run: azd auth login --federated-credential-provider github --client-id ${{ secrets.AZURE_CLIENT_ID }} --tenant-id ${{ secrets.AZURE_TENANT_ID }}

      - name: Publish
        env:
          AZURE_LOCATION: 'westus2'
          AZURE_RESOURCE_GROUP: 'rg-niobium-identity-prod'
          AZURE_ENV_NAME: 'prod'
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          CUSTOM_DOMAIN_NAME: ${{ secrets.CUSTOM_DOMAIN_NAME }}
          IS_INTERACTIVE_DEPLOYER: false
          APPSETTING_SERVICE_NAME: 'Niobium.Identity.Server.Prod'
          APPSETTING_SERVICE_VERSION: ${{ env.buildVersion }}
          APPSETTING_CAPTCHAOPTIONS__ISDISABLED: 'false'
          APPSETTING_IDENTITYSERVICEOPTIONS__IDTOKENPUBLICKEY: '-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----'
          APPSETTING_KV_IDENTITYSERVICEOPTIONS__IDTOKENPRIVATEKEY: ${{ secrets.APPSETTING_IDENTITYSERVICEOPTIONS__IDTOKENPRIVATEKEY }}
          APPSETTING_KV_IDENTITYSERVICEOPTIONS__IDTOKENPRIVATEKEYPASSCODE: ${{ secrets.APPSETTING_IDENTITYSERVICEOPTIONS__IDTOKENPRIVATEKEYPASSCODE }}
        run: |
          azd package --no-prompt
          azd provision --no-state --no-prompt
          azd deploy --no-prompt
      