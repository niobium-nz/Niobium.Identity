name: '1.0$(Rev:.r)'
trigger:
- master

parameters:
- name: updateInfrastructure
  type: boolean
  default: false
  displayName: Update Infrastructure
  values:
    - true
    - false

variables:
  buildAgentVmImage: 'windows-latest'
  serviceConnection: 'codidentity'
  resourceGroupName: 'codidentity'
  appName: 'codidentityFunc'
  enableStagingSlot: true

pool:
  vmImage: $(buildAgentVmImage)

resources: 
  repositories:
  - repository: devops
    type: git
    name: cod/Cod.Infrastructures
    ref: master

stages:
- stage: Production
  jobs:
  - template: pipelines/jobs/GenericDotnetBuild.yml@devops
    parameters:
      projectToPublish: '**/Niobium.Platform.Identity.API.Functions.csproj'

  - template: pipelines/jobs/FunctionAppInfrastructure.yml@devops
    parameters:
      enabled: ${{ parameters.updateInfrastructure }}
      azureServiceConnection: $(serviceConnection)
      resourceGroupName: $(resourceGroupName)
      appName: $(appName)
      enableKeyVault: true
      enableStagingSlot: ${{ variables.enableStagingSlot }}
      allowedOrigins: '*'
      checkoutDevopsStep:
        checkout: devops

  - job: Table
    dependsOn: 
      - Infrastructure
    condition: succeeded()
    pool:
      vmImage: $(buildAgentVmImage)
    variables:
      functionAppPrincipalId: $[dependencies.Infrastructure.outputs['infrastructureOutputs.functionAppPrincipalId']]
    steps:
    - checkout: devops
    - template: pipelines/steps/newStorageAccount.yml@devops
      parameters:
        azureServiceConnection: $(serviceConnection)
        resourceGroupName: $(resourceGroupName)
        storageAccountName: 'codidentitydb'
        contributorPrincipalId: $(functionAppPrincipalId)

  - job: Configuration
    dependsOn:
      - Infrastructure
      - Table
    condition: succeeded()
    pool:
      vmImage: $(buildAgentVmImage)
    variables:
      tableFQDN: $[dependencies.Table.outputs['newStorageAccountProperties.tableFQDN']]
      keyVaultUrl: $[dependencies.Infrastructure.outputs['infrastructureOutputs.keyVaultUrl']]
    steps:
    - checkout: none
    - pwsh: Write-Output "##vso[task.setvariable variable=slotName;]production"
      displayName: "Deploy to Production"
      condition: eq('${{ variables.enableStagingSlot }}', false)
    - pwsh: Write-Output "##vso[task.setvariable variable=slotName;]staging"
      displayName: "Deploy to Staging"
      condition: eq('${{ variables.enableStagingSlot }}', true)
    - task: AzureAppServiceSettings@1
      displayName: 'Update AppSettings'
      inputs:
        azureSubscription: $(serviceConnection)
        appName: $(appName)
        resourceGroupName: $(resourceGroupName)
        appSettings: |
          [
            {
              "name": "StorageTableOptions:FullyQualifiedDomainName",
              "value": "$(tableFQDN)",
              "slotSetting": false
            },
            {
              "name": "IdentityServiceOptions:TokenValidity",
              "value": "720",
              "slotSetting": false
            },
            {
              "name": "IdentityServiceOptions:IDTokenPublicKey",
              "value": "-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----",
              "slotSetting": true
            },
            {
              "name": "IdentityServiceOptions:IDTokenPrivateKey",
              "value": "@Microsoft.KeyVault(SecretUri=$(keyVaultUrl)/secrets/ID-TOKEN-PRIVATE-KEY/)",
              "slotSetting": true
            },
            {
              "name": "IdentityServiceOptions:IDTokenPrivateKeyPasscode",
              "value": "@Microsoft.KeyVault(SecretUri=$(keyVaultUrl)/secrets/ID-TOKEN-PRIVATE-KEY-PASSCODE/)",
              "slotSetting": true
            }
          ]
    - task: AzureAppServiceSettings@1
      displayName: 'Update AppSettings'
      inputs:
        azureSubscription: $(serviceConnection)
        appName: $(appName)
        slotName: $(slotName)
        resourceGroupName: $(resourceGroupName)
        appSettings: |
          [
            {
              "name": "IdentityServiceOptions:IDTokenPublicKey",
              "value": "-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----",
              "slotSetting": true
            },
            {
              "name": "IdentityServiceOptions:IDTokenPrivateKey",
              "value": "-----BEGIN RSA PRIVATE KEY----------END RSA PRIVATE KEY-----",
              "slotSetting": true
            },
            {
              "name": "IdentityServiceOptions:IDTokenPrivateKeyPasscode",
              "value": "Mlgbhahahaha123$56",
              "slotSetting": true
            }
          ]

  - template: pipelines/jobs/FunctionAppDeploy.yml@devops
    parameters:
      appName: $(appName)
      serviceConnection: $(serviceConnection)
      resourceGroupName: $(resourceGroupName)
      enableStagingSlot: ${{ variables.enableStagingSlot }}
      autoSwapSlots: true
